<style>
:root{--ink:#2E2A4F;--ink2:#5D5880;--line:#E2DDEC;--bg:#F6F4EE;--card:#FFFFFF;--butter:#FFE38A;--mint:#BFE5CF;--pink:#FBD3CE;--lilac:#E4E1F2;--cream:#FFF4C9;--berry:#D8625A;--ok:#2F6B47;

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #F2877E;outline-offset:2px}
svg{display:block;max-width:100%}
.app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.t1{background:#BFDDF2}.t2{background:#FFE38A}.t3{background:#FBD3CE}.t4{background:#BFE5CF}.t5{background:#E4E1F2}
header{position:sticky;top:0;z-index:10;background:rgba(246,244,238,.95);backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:var(--round);font-weight:400;font-size:20px}
header small{display:block;font-size:12px;color:var(--ink2);font-family:var(--sans)}
.link{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;padding:8px 12px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}
.note{margin:14px 18px 0;padding:10px 14px;background:var(--cream);border-radius:12px;font-size:13px;color:var(--ink2)}
.bar{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 8px}
.bar h2{margin:0;font-family:var(--round);font-weight:400;font-size:22px}
.bar span{font-size:13px;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:12px;padding:6px 18px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;display:grid;place-items:center}
.thumb img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item b{font-family:var(--round);font-weight:400;font-size:19px;display:block}
.item .sub{font-size:13px;color:var(--ink2)}
.item .chev{margin-left:auto;font-size:20px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:13.5px;padding:6px 4px}
.seg button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.seg button[data-v="available"][aria-pressed="true"]{background:var(--mint)}
.seg button[data-v="talking"][aria-pressed="true"]{background:var(--butter)}
.seg button[data-v="home"][aria-pressed="true"]{background:var(--lilac)}
.seg button[data-v="stay"][aria-pressed="true"]{background:var(--cream)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button i{font-style:normal;font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
/* edit */
.form{padding:8px 18px 120px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field>span{font-size:13.5px;color:var(--ink2);font-weight:500}
.field small{font-size:12px;color:var(--ink2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line)}
.group h3{margin:0;font-family:var(--round);font-weight:400;font-size:18px}
.group p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.ph .x{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(46,42,79,.75);color:#fff;font-size:16px;line-height:1}
.ph .cover{position:absolute;left:6px;bottom:6px;font-size:11px;background:#fff;border-radius:8px;padding:1px 7px}
.ph .lbl{position:absolute;left:6px;bottom:6px;right:6px;font-size:12px;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 7px;text-align:center}
.add{border:2px dashed var(--line);background:#fff;color:var(--ink2);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.add i{font-style:normal;font-size:24px}
.range{display:grid;grid-template-columns:56px 1fr 24px;gap:10px;align-items:center;margin-top:8px;font-size:14px}
.range input{padding:0;border:0;accent-color:#2E2A4F}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:13;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.actions div{max-width:504px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:15.5px}
.btn.pri{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--berry);color:var(--berry)}
.btn.danger.sure{background:var(--berry);color:#fff}
.btn.small{flex:none;min-height:40px;padding:0 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:20;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.backbar{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.backbar button{border:0;background:none;font-size:15px;font-weight:700;padding:6px 0}
.preview-link{display:inline-block;margin-top:10px;font-size:14px;color:var(--ink);font-weight:700}
.empty{margin:24px 18px;padding:28px;text-align:center;background:#fff;border-radius:18px;border:1px dashed var(--line);color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- 照片：壓縮後存成 data URL ---------- */
function shrink(file,max=900){
  return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",.8)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("讀不到這張圖")); }; img.src=url; });
}
function readForm(){
  const f=document.getElementById("editForm"); if(!f) return; const d=Object.fromEntries(new FormData(f));
  ["name","en","breed","color","birthday","ready","price","sire","dam","formerly","home","registry","note"].forEach(k=>{ if(k in d) draft[k]=d[k].trim(); });
  if(d.role) draft.role=d.role;
  if("traits" in d) draft.traits=d.traits.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);
  if(SCORE_KEYS.some(k=>("score_"+k) in d)){ draft.scores={}; SCORE_KEYS.forEach(k=>draft.scores[k]=+d["score_"+k]||3); }
}
document.getElementById("filePick").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  readForm(); toast("處理照片中⋯");
  try{
    for(const f of files){ const url=await shrink(f);
      if(pickMode==="timeline"){ const lb=(document.getElementById("tlLabel")||{}).value||`第 ${(draft.timeline||[]).length+1} 張`; (draft.timeline=draft.timeline||[]).push({label:lb.trim(),img:url}); }
      else (draft.photos=draft.photos||[]).push(url); }
    toast("照片加好了，記得按儲存");
  }catch(err){ toast(err.message); }
  render();
});

/* ---------- 事件 ---------- */
$app.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  if(b.dataset.status){ const c=byId(b.dataset.id); c.status=b.dataset.status; persist(`${c.name} → ${STATUS[c.status]}，前台已更新`); render(); return; }
  if(b.dataset.edit){ editing=b.dataset.edit; draft=JSON.parse(JSON.stringify(byId(editing))); sureDelete=false; render(); scrollTo(0,0); return; }
  if(b.dataset.new){ draft=newCat(b.dataset.new); editing=draft.id; sureDelete=false; render(); scrollTo(0,0); return; }
  if("back" in b.dataset){ editing=null; draft=null; sureDelete=false; render(); return; }
  if(b.dataset.pick){ pickMode=b.dataset.pick; const fp=document.getElementById("filePick"); fp.multiple=pickMode==="photos"; fp.click(); return; }
  if(b.dataset.delphoto){ readForm(); draft.photos.splice(+b.dataset.delphoto,1); render(); return; }
  if(b.dataset.deltl){ readForm(); draft.timeline.splice(+b.dataset.deltl,1); render(); return; }
  if(b.dataset.dstatus){ readForm(); draft.status=b.dataset.dstatus; render(); return; }
  if(b.dataset.sex){ readForm(); draft.sex=b.dataset.sex; render(); return; }
  if("delete" in b.dataset){ if(!sureDelete){ sureDelete=true; readForm(); render(); return; }
    const name=draft.name; CATS=CATS.filter(x=>x.id!==draft.id); persist(`已刪除${name}`); editing=null; draft=null; sureDelete=false; render(); return; }
  if("reset" in b.dataset){ if(!sureDelete){ sureDelete=true; render(); return; }
    resetAll(); CATS=loadCats(); Object.assign(SITE,DEFAULT_SITE); sureDelete=false; toast("已回到範例資料"); render(); return; }
});
$app.addEventListener("input",e=>{ const o=e.target.dataset&&e.target.dataset.out; if(o) document.getElementById(o).textContent=e.target.value; });
$app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="siteForm"){ const d=Object.fromEntries(new FormData(e.target)); Object.assign(SITE,d); saveSite(d)?toast("貓舍資料已儲存"):toast("儲存失敗"); return; }
  readForm(); if(!draft.name){ toast("請先填名字"); return; }
  const i=CATS.findIndex(x=>x.id===draft.id); const isNew=i<0;
  if(isNew) CATS.push(draft); else CATS[i]=draft;
  if(persist(isNew?`已新增${draft.name}，前台已更新`:`已儲存${draft.name}，前台已更新`)){
    const t=Object.entries(ROLE_OF_TAB).find(([k,v])=>v.includes(draft.role)); if(t) tab=t[0];
    editing=null; draft=null; sureDelete=false; render(); scrollTo(0,0);
  }
});
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; editing=null; draft=null; sureDelete=false; render(); scrollTo(0,0); });
addEventListener("storage",e=>{ if(e.key===STORE_KEY && !editing){ CATS=loadCats(); render(); } });
render();
</script>
</body>
</html>
